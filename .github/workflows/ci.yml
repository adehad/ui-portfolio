name: CI

on:
  push:
    branches: [config, before, after]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build-storybook

      - name: Prove a narrowed build carries one case
        if: github.ref_name != 'config'
        run: bun run check:showcase

      - uses: actions/upload-artifact@v7
        with:
          name: storybook-${{ github.ref_name }}
          path: storybook-static
          retention-days: 7

  publish:
    needs: check
    if: github.ref_name == 'before' || github.ref_name == 'after'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic walks git history to pick which earlier build is the baseline.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: storybook-${{ github.ref_name }}
          path: storybook-static

      - uses: chromaui/action@v18
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        with:
          storybookBuildDir: storybook-static
          exitZeroOnChanges: true

  pages:
    needs: check
    if: github.ref_name == 'config'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Stage the comparison page on its own
        run: |
          mkdir site
          cp tools/compare/index.html site/index.html
          # Everything in this directory reaches an indexable URL, so a stray
          # file here would publish work this repo otherwise keeps to itself.
          test "$(find site -type f | wc -l)" -eq 1

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
